<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

  <link rel="icon"
        type="image/svg+xml"
        href="{{ '/assets/images/favicon.svg' | relative_url }}">
</head>


<body>

  <header class="site-header">
    <div class="container header-inner">

      <a class="site-title" href="{{ '/' | relative_url }}">
        <span class="site-name">St. Michael's</span>
        <span class="site-subtitle">Holy Name Society</span>
      </a>

      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"
           {% if page.url == '/' %}class="active"{% endif %}>
          Home
        </a>

  <a href="{{ '/resources/' | relative_url }}"
     {% if page.url == '/resources/' %}class="active"{% endif %}>
    Resources
  </a>
</nav>


    </div>
  </header>


  <main class="site-main">
    <div class="container">

      {% if page.title %}
        <div class="page-heading">
          <h1>{{ page.title }}</h1>
        </div>
      {% endif %}

      {{ content }}

    </div>
  </main>


  <footer class="site-footer">
    <div class="container">

      <p>
        <strong>St. Michael's Holy Name Society</strong>
      </p>

      <p class="footer-note">
        This is not the official website of St. Michael's Church.
      </p>

      <p class="footer-updated">
        Site information is maintained by Jack Hamond.
        <br>
        Last updated: {{ site.last_updated }}
      </p>

    </div>
  </footer>

</body>
</html>
